name: BrownSync

options:
  bundleIdPrefix: com.noahfinkelstein
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release
  CI: debug

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  BrownSyncAPI:
    path: packages/BrownSyncAPI
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.28.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.54.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.2.0
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    exactVersion: 1.12.0
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    exactVersion: 1.3.1
  HTTPTypes:
    url: https://github.com/apple/swift-http-types
    exactVersion: 1.6.0

targets:
  BrownSync:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/BrownSync
        excludes:
          - Info.plist
      - path: Generated
      - path: Resources
        excludes:
          - glyphs
        buildPhase: resources
      - path: Resources/glyphs
        type: folder
        buildPhase: resources
    info:
      path: Sources/BrownSync/Info.plist
      properties:
        BROWNSYNC_API_BASE_URL: "$(BROWNSYNC_API_BASE_URL)"
        BROWNSYNC_BUILD_ENVIRONMENT: "$(BROWNSYNC_BUILD_ENVIRONMENT)"
        BROWNSYNC_CONTENT_URL_SCHEME: "$(BROWNSYNC_CONTENT_URL_SCHEME)"
        BROWNSYNC_GOOGLE_IOS_CLIENT_ID: "$(BROWNSYNC_GOOGLE_IOS_CLIENT_ID)"
        BROWNSYNC_GOOGLE_REVERSED_CLIENT_ID: "$(BROWNSYNC_GOOGLE_REVERSED_CLIENT_ID)"
        BROWNSYNC_GOOGLE_SERVER_CLIENT_ID: "$(BROWNSYNC_GOOGLE_SERVER_CLIENT_ID)"
        BROWNSYNC_SUPABASE_PUBLISHABLE_KEY: "$(BROWNSYNC_SUPABASE_PUBLISHABLE_KEY)"
        BROWNSYNC_SUPABASE_URL: "$(BROWNSYNC_SUPABASE_URL)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - "$(BROWNSYNC_GOOGLE_REVERSED_CLIENT_ID)"
              - "$(BROWNSYNC_CONTENT_URL_SCHEME)"
        NSLocationWhenInUseUsageDescription: Your coordinates are processed only on this device; only the campus place you choose is shared.
        UILaunchScreen: {}
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig
      CI: Configuration/CI.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noahfinkelstein.BrownSync
        PRODUCT_NAME: BrownSync
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: BrownSyncAPI
        product: BrownSyncAPI
      - package: MapLibre
        product: MapLibre
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: OpenAPIRuntime
        product: OpenAPIRuntime
      - package: OpenAPIURLSession
        product: OpenAPIURLSession
      - package: HTTPTypes
        product: HTTPTypes

  BrownSyncTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Tests/BrownSyncTests
      - Tests/Phase3RED
      - Tests/Phase4RED/Phase4TestSupport.swift
      - Tests/Phase4RED/OrganizationGeneratedV2OperationsREDTests.swift
      - Tests/Phase4RED/OrganizationEditConflictREDTests.swift
      - Tests/Phase4RED/OrganizationOwnershipLifecycleTests.swift
      - Tests/Phase4RED/OrganizationOwnershipRepositoryREDTests.swift
      - Tests/Phase4RED/OrganizationOwnershipSecurityREDTests.swift
      - Tests/Phase4RED/OrganizationReviewPaginationREDTests.swift
      - Tests/Phase5UserEventsRED
      - Tests/Phase5OrgMediaRED
      - Tests/Phase5BoardRED
    dependencies:
      - target: BrownSync
      - package: BrownSyncAPI
        product: BrownSyncAPI
      - package: OpenAPIRuntime
        product: OpenAPIRuntime
      - package: HTTPTypes
        product: HTTPTypes
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig
      CI: Configuration/CI.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noahfinkelstein.BrownSyncTests
        GENERATE_INFOPLIST_FILE: YES

  BrownSyncUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Tests/BrownSyncUITests
    dependencies:
      - target: BrownSync
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig
      CI: Configuration/CI.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noahfinkelstein.BrownSyncUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BrownSync

schemes:
  BrownSync:
    build:
      targets:
        BrownSync: all
        BrownSyncTests: [test]
        BrownSyncUITests: [test]
    test:
      targets:
        - BrownSyncTests
        - BrownSyncUITests
