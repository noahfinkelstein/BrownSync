# Cloudflare Workers config for the read API. Entry: src/worker.ts (the Node
# entry src/server.ts stays the local-dev default). Nothing here deploys by
# itself — see DEPLOY.md for the one-time Hyperdrive + deploy steps.
#
# Local check without Cloudflare auth:
#   pnpm --filter @brownsync/api build:worker   (wrangler deploy --dry-run)
#   pnpm --filter @brownsync/api dev:worker     (uses localConnectionString)

name = "brownsync-api"
main = "src/worker.ts"
compatibility_date = "2026-07-01"
# postgres.js needs node:net/tls/crypto on Workers; also provides `process`.
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Hyperdrive pools TCP connections to Supabase Postgres at the edge — required
# because each Worker request opens a fresh postgres.js connection. One-time:
#   npx wrangler hyperdrive create brownsync-db \
#     --connection-string="<Supabase session-pooler URI, DEPLOY.md step 4>"
# then replace `id` below with the returned id.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "0548aab052da48ada0056c1522bad8e0"
# `wrangler dev` ignores `id` and connects here instead (local `pnpm db:start`).
localConnectionString = "postgresql://postgres:postgres@127.0.0.1:54322/postgres"

# NODE_ENV needs no var: wrangler inlines process.env.NODE_ENV at build time
# ("production" on deploy), which disables app.ts's dev-only response
# re-validation exactly as intended.
[vars]
CORS_ORIGINS = "https://brownsync.pages.dev"
SUPABASE_URL = "https://hkrxahzdqqxxovvilalm.supabase.co"
# Infrastructure launch gate. After the first true deployment it is sticky;
# use board_control.enabled, not this flag, as the operational kill switch.
# DEPLOY.md requires a real BOARD_WRITE_LIMITER binding and the server-only
# BOARD_AUTHOR_PEPPER secret before this may become true. No binding ID is
# guessed here; board writes fail closed until the operator provisions it.
BOARD_ENABLED = "false"

[[ratelimits]]
name = "PUBLIC_READ_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "USER_WRITE_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "USER_READ_LIMITER"
namespace_id = "1003"
simple = { limit = 60, period = 60 }
