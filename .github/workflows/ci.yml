name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm turbo run typecheck test build
      - name: Worker bundles (wrangler dry-run, offline)
        # The dispatcher makes the Worker a consumer of packages/sources; this
        # is what fails CI — instead of the next deploy — if a node:* import
        # ever sneaks into that package.
        run: pnpm --filter @brownsync/api build:worker
      - name: Seed QA sweep (offline — schemas, FKs, manifest hashes)
        run: pnpm db:seed-check
      - name: Install Playwright chromium
        run: pnpm --filter @brownsync/web exec playwright install --with-deps chromium
      - name: Hermetic e2e (smoke, journey, a11y, perf tripwire)
        # PERF_ENFORCE stays UNSET here on purpose: headless SwiftShader cannot
        # meet the 32 ms p95 soft budget (p95 ~170-230 ms warm); the always-on
        # 1.5 s tripwire in perf.e2e.ts still catches regression storms. Run
        # PERF_ENFORCE=1 on GPU hardware for the real gate.
        run: pnpm --filter @brownsync/web e2e

  ingest:
    # The Python lane had NO CI job at all: ~1,155 offline tests, including
    # every fixture-integrity and fail-closed-gate assertion, ran only on a
    # developer's machine. They are fully offline (recorded, hash-pinned
    # fixtures; `test_fixtures.py` rejects silent synthetic substitution), so
    # there is nothing to gate them behind.
    #
    # The postgres-marked tests stay skipped here — the `migrate` job owns the
    # DATABASE_URL-gated parity checks against a real PostGIS container.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Python offline test suite
        working-directory: ingest
        run: uv run pytest -q
      - name: Rebuild the seed bundle from pinned fixtures
        working-directory: ingest
        run: uv run ingest run all --out ndjson --seeds-dir ../db/seeds --staging-root ../reports/tmp
      - name: Data artifacts must rebuild byte-identically
        # Determinism guard. Every producer reads only recorded, hash-pinned
        # fixtures, so the DATA files must come out byte-for-byte identical; a
        # diff means a producer went non-deterministic (unstable sort, dict
        # iteration order, a stray timestamp) and CI should say so rather than
        # let it surface as a mystery diff in someone else's PR.
        #
        # Deliberately EXCLUDED, because these change on every run by design:
        #   manifest.json                     fresh `generation` uuid + generated_at
        #   athletics_venues.json             carries generated_at
        #   brown_owned_buildings.json        carries generated_at
        #   organization_livewhale_groups.json carries generated_at
        #   dining_menus.json                 carries generated_at
        #   publications.json                 carries generated_at
        #   library_hours.json                carries generated_at
        #   source_runs.ndjson                append-only run history
        run: |
          set -euo pipefail
          DETERMINISTIC="db/seeds/places.ndjson \
                         db/seeds/course_meetings.ndjson \
                         db/seeds/organizations.ndjson \
                         db/seeds/events.ndjson \
                         db/seeds/campus_buildings.geojson \
                         db/seeds/campus_landmarks.geojson \
                         db/seeds/campus_amenities.geojson"
          if ! git diff --quiet -- $DETERMINISTIC; then
            echo "::error::ingest run all produced different bytes for a data artifact"
            git diff --stat -- $DETERMINISTIC
            exit 1
          fi
          echo "ok: every data artifact rebuilt byte-identically"
      - name: Manifest covers exactly the published artifacts
        run: |
          git checkout -- db/seeds/ 2>/dev/null || true
          pnpm install --frozen-lockfile
          pnpm --filter @brownsync/contract build
          pnpm db:seed-check

  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations in order
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/checks/0010_ci_auth_bootstrap.sql
          for f in db/migrations/*.sql; do
            echo "applying $f"
            PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Read-API SQL semantic checks (rollback-safe)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/checks/0002_api_checks.sql
      - name: Term-reconciliation SQL checks (rollback-safe, re-applies 0003 for idempotency)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/checks/0003_term_checks.sql
      - name: BDH licence SQL checks (rollback-safe, re-applies 0004 for idempotency)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/checks/0004_bdh_licence_checks.sql

      - name: BDH guid-collapse SQL checks (rollback-safe, re-applies 0004+0020 for idempotency)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/checks/0020_bdh_guid_checks.sql
      - name: Index hygiene SQL checks (rollback-safe)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/checks/0005_index_checks.sql
      - name: Source registry SQL checks (rollback-safe)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/checks/0006_source_registry_checks.sql
      - name: Place resolution SQL checks (rollback-safe)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/checks/0007_place_resolution_checks.sql
      - name: Worker dispatcher registry SQL checks (rollback-safe)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/checks/0018_dispatcher_checks.sql
      - name: Identity SQL checks (rollback-safe)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/checks/0010_identity_checks.sql
      - name: RLS SQL checks (rollback-safe)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/checks/0011_rls_checks.sql
      - name: Social SQL checks (rollback-safe)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/checks/0012_social_checks.sql
      - name: Social SQL two-session race checks
        run: BROWNSYNC_DISPOSABLE_SOCIAL_RACE=1 PGPASSWORD=postgres bash db/checks/0012_social_race.sh postgresql://postgres:postgres@localhost:5432/postgres
      - name: Organization enrichment SQL checks (rollback-safe)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/checks/0013_org_enrichment_checks.sql
      - name: Organization administration SQL checks (rollback-safe)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/checks/0014_org_admin_checks.sql
      - name: Organization administration multi-session race checks
        run: BROWNSYNC_DISPOSABLE_ORG_RACE=1 PGPASSWORD=postgres bash db/checks/0014_org_admin_race.sh postgresql://postgres:postgres@localhost:5432/postgres
      - name: Native board SQL checks (rollback-safe)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/checks/0015_board_checks.sql
      - name: Native board multi-session race checks
        run: BROWNSYNC_DISPOSABLE_BOARD_RACE=1 PGPASSWORD=postgres bash db/checks/0015_board_race.sh postgresql://postgres:postgres@localhost:5432/postgres
      - name: Student-created event SQL checks (rollback-safe)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/checks/0016_user_events_checks.sql
      - name: Student-created event multi-session race checks
        run: BROWNSYNC_DISPOSABLE_USER_EVENT_RACE=1 PGPASSWORD=postgres bash db/checks/0016_user_events_race.sh postgresql://postgres:postgres@localhost:5432/postgres
      - name: Organization assets SQL checks (rollback-safe)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f db/checks/0017_org_assets_checks.sql
      - name: Organization assets multi-session race checks
        run: BROWNSYNC_DISPOSABLE_ORG_ASSET_RACE=1 PGPASSWORD=postgres bash db/checks/0017_org_assets_race.sh postgresql://postgres:postgres@localhost:5432/postgres
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @brownsync/contract build
      - name: Seed loader runs against migrated schema
        run: pnpm db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Poller DB integration tests (upsert/sweep/source_runs + cross-source dedup)
        run: pnpm --filter @brownsync/poller exec vitest run test/db.integration.test.ts test/dedup.integration.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Poller one-shot from recorded fixtures (non-dry-run)
        run: |
          pnpm poll all --fixture
          # Second pass exercises the on-conflict update + all-seen sweep path.
          pnpm poll all --fixture
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Cross-source dedup one-shot over the ingested fixtures
        run: pnpm poll dedup
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Assert dedup invariants held
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          check() {
            local desc="$1" query="$2" got
            got=$(psql -h localhost -U postgres -d postgres -tAc "$query")
            if [ "$got" != "t" ]; then
              echo "FAIL: $desc — ($query) returned '$got'"
              exit 1
            fi
            echo "ok: $desc"
          }
          check "dedup run recorded ok in source_runs" \
            "select count(*) >= 1 from source_runs where source = 'dedup' and status = 'ok'"
          check "no canonical chains (canonical_id always points at a canonical row)" \
            "select count(*) = 0 from events d join events c on d.canonical_id = c.id where c.canonical_id is not null"
          check "no self-referencing canonical_id" \
            "select count(*) = 0 from events where canonical_id = id"
          check "dedup never deletes — all fixture sources still present" \
            "select count(distinct source) = 3 from events where source in ('livewhale', 'athletics_ics', 'bdh')"
      - name: Assert poller rows actually landed
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          check() {
            local desc="$1" query="$2" got
            got=$(psql -h localhost -U postgres -d postgres -tAc "$query")
            if [ "$got" != "t" ]; then
              echo "FAIL: $desc — ($query) returned '$got'"
              exit 1
            fi
            echo "ok: $desc"
          }
          check "livewhale events landed" \
            "select count(*) > 0 from events where source = 'livewhale'"
          check "athletics events landed" \
            "select count(*) > 0 from events where source = 'athletics_ics'"
          check "bdh events landed" \
            "select count(*) > 0 from events where source = 'bdh'"
          check "upsert key held — no duplicate (source, source_id)" \
            "select count(*) = count(distinct (source, source_id)) from events"
          check "second pass refreshed last_seen_at" \
            "select count(*) > 0 from events where source = 'livewhale' and last_seen_at > first_seen_at"
          # THE regression guard for the LiveWhale sharding fix. Before it, one
          # unbounded fetch always came back at the server's 1000-row cap, so
          # 'partial' was structural and 'ok' was unreachable for the primary
          # source. The sharded replay proves completeness window by window.
          check "sharded livewhale fixture recorded ok, not partial" \
            "select count(*) = 2 from source_runs where source = 'livewhale' and status = 'ok'"
          check "no livewhale run recorded partial" \
            "select count(*) = 0 from source_runs where source = 'livewhale' and status = 'partial'"
          check "athletics + bdh runs recorded ok" \
            "select count(*) = 4 from source_runs where source in ('athletics_ics', 'bdh') and status = 'ok'"
          check "no error runs recorded" \
            "select count(*) = 0 from source_runs where source in ('livewhale', 'athletics_ics', 'bdh') and status = 'error'"
      - name: Assert place resolution survived the poll
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          check() {
            local desc="$1" query="$2" got
            got=$(psql -h localhost -U postgres -d postgres -tAc "$query")
            if [ "$got" != "t" ]; then
              echo "FAIL: $desc — ($query) returned '$got'"
              exit 1
            fi
            echo "ok: $desc"
          }
          # The seed bundle ships 229 resolved livewhale place_ids. The poller
          # emits place_id null, so before migration 0007 the first refresh
          # nulled every one it touched — which is why /api/events served 500
          # rows with zero placeId.
          check "livewhale place resolution survived the poll" \
            "select count(*) > 100 from events where source = 'livewhale' and place_id is not null"
          # Sharper: rows the poller ACTUALLY refreshed this run must still
          # carry their place. 57 of the fixture's rows are seeded with one, so
          # the old bare 'place_id = excluded.place_id' would land this at 0.
          check "refreshed livewhale rows kept their resolved place" \
            "select count(*) > 50 from events where source = 'livewhale' and place_id is not null and last_seen_at > first_seen_at"
          check "the alias index covers the loaded gazetteer" \
            "select count(*) > 100 from place_aliases"

      # Migration 0007 makes the DATABASE a second implementation of a resolver
      # whose Python original was itself written to mirror pg_trgm. This is the
      # pin between them: the same corpus through both, asserting identical
      # (place_id, room, method). It runs in a transaction it always rolls back.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: SQL/Python place-resolver parity
        working-directory: ingest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run pytest -q tests/gazetteer/test_sql_resolver_parity.py
