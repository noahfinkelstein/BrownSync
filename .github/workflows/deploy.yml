name: Deploy

# apps/web → Cloudflare Pages. Until the Cloudflare secrets exist this
# no-ops loudly (green with a warning, never red) — see DEPLOY.md step 2.
# The API worker is deployed manually with wrangler (DEPLOY.md step 4);
# it needs a real Hyperdrive id in apps/api/wrangler.toml first.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gate on Cloudflare secrets
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — deploy skipped. See DEPLOY.md step 2."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.ready == 'true'

      - name: Build web (deps via turbo)
        if: steps.gate.outputs.ready == 'true'
        run: pnpm turbo run build --filter=@brownsync/web...
        env:
          # Repo *variables* (gh variable set …, DEPLOY.md step 2). The app
          # reads VITE_API_URL; VITE_API_ORIGIN is the canonical repo-var name,
          # mapped here. VITE_CANONICAL_ORIGIN is passed through for absolute
          # OG/meta URLs once index.html consumes it.
          VITE_API_URL: ${{ vars.VITE_API_ORIGIN }}
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
          VITE_CANONICAL_ORIGIN: ${{ vars.VITE_CANONICAL_ORIGIN }}
          # Optional: R2-hosted basemap; empty falls back to bundled /tiles path.
          VITE_PMTILES_URL: ${{ vars.VITE_PMTILES_URL }}
          # Optional analytics (analytics.ts no-ops when the key is empty).
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'brownsync' }} --branch=${{ github.ref_name }}
