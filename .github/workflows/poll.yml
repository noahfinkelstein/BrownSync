name: Poll

# Manual dispatch + cron (flipped live in Phase 3). Cadence per source
# etiquette; every value here is mirrored as data in `source_registry`
# (migration 0006), which is the source of truth for cadence and staleness:
#   - livewhale       every 15 min   ("*/15 * * * *" — contract §5 allows
#     <= every 10 min; 15 is politer)
#   - athletics + bdh every 2 hours  ("37 */2 * * *" — the athletics ICS
#     publishes X-PUBLISHED-TTL PT120M and robots.txt asks for Crawl-delay
#     30, so an hourly poll refetched an unchanged calendar; the offset
#     minute keeps it off the */15 ticks and the top-of-hour pileup)
#   - dedup           hourly         ("52 * * * *")
# Which sources run is derived from which cron string fired
# (github.event.schedule), not from wall-clock time — GH cron runs can start
# minutes late, so time-based gating would misfire.
#
# WHY DEDUP HAS ITS OWN CRON. It used to ride the hourly athletics tick,
# because a scheduled run's source list is per-source and never 'all', so
# without a rider the cross-source dedup job would simply never run in
# production. Slowing athletics to 2 hours would therefore have silently
# halved dedup's cadence too — a cross-source duplicate would survive twice
# as long, with nothing in the diff to say so. Dedup gets its own entry
# instead, keeping its hourly cadence independent of any feed's etiquette.
#
# Until secrets.DATABASE_URL exists every run no-ops loudly (green with a
# warning, never red) — see DEPLOY.md step 2.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source to poll"
        type: choice
        options:
          - all
          - livewhale
          - athletics
          - bdh
          - dedup
        default: all
  schedule:
    - cron: "*/15 * * * *" # livewhale
    - cron: "37 */2 * * *" # athletics + bdh (X-PUBLISHED-TTL PT120M)
    - cron: "52 * * * *" # dedup (was riding the athletics tick)

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Gate on DATABASE_URL
        id: gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::warning::DATABASE_URL secret not set — poll skipped, nothing fetched or written. See DEPLOY.md step 2."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve sources for this trigger
        id: sources
        if: steps.gate.outputs.ready == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          INPUT_SOURCE: ${{ inputs.source }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            list="${INPUT_SOURCE:-all}"
          elif [ "$CRON" = "37 */2 * * *" ]; then
            list="athletics bdh"
          elif [ "$CRON" = "52 * * * *" ]; then
            list="dedup"
          else
            list="livewhale"
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "polling: $list"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.ready == 'true'
      - run: pnpm --filter @brownsync/contract build
        if: steps.gate.outputs.ready == 'true'

      - name: Poll ${{ steps.sources.outputs.list }}
        if: steps.gate.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POLLER_USER_AGENT: "BrownSync/1.0 (+noah_finkelstein@brown.edu)"
        run: |
          for s in ${{ steps.sources.outputs.list }}; do
            pnpm poll "$s"
          done

      - name: Cross-source dedup after a full poll
        # Duplicates only form across feeds, so dedup rides along whenever the
        # full set was just polled in one go (dispatch source=all). The
        # SCHEDULED path no longer rides another source's tick — dedup has its
        # own "52 * * * *" entry, handled by the loop above — so its cadence is
        # independent of any feed's etiquette. Dispatching source=dedup runs it
        # alone, also via the loop.
        if: >-
          steps.gate.outputs.ready == 'true' &&
          steps.sources.outputs.list == 'all'
        run: pnpm poll dedup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
