[project]
name = "brownsync-ingest"
version = "0.1.0"
description = "BrownSync ingestion contract utilities"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "rapidfuzz>=3,<4",
  "shapely>=2.0,<3",
  "tenacity>=9,<10",
  "typer>=0.12,<1",
]

[project.scripts]
ingest = "brownsync_ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brownsync_ingest"]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "postgres: integration tests that require TEST_DATABASE_URL pointing at a disposable Postgres",
]
