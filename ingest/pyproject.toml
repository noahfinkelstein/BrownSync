[project]
name = "brownsync-ingest"
version = "0.1.0"
description = "BrownSync ingestion contract utilities"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "tenacity>=9,<10",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
