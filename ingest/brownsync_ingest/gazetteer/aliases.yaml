# globally unique across the catalog (the loader fails closed on collisions).
# `osm` is the exact OpenStreetMap `name` tag to merge geometry from (defaults
# to `name`); entries without an OSM match must carry curated lat/lng.
# Geometry, addresses, and osm ids merged from OSM are ODbL-licensed.
