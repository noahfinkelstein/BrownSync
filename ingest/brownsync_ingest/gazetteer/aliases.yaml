  # Without this entry the trigram stage bound them to Page-Robinson Hall
  # via its "69 Brown Street" alias (0.684) — a different building across
  # the street. 70 Brown Street is its own OSM university building
  # (way/1073442221) in the recorded Overpass fixture.
  - name: 70 Brown Street
    kind: academic
    aliases: [70 Brown Street, 70 Brown St]
  # Task 10 review: "155 South Main Street - Packet NNN" rows mis-bound to
  # 121 South Main Street (0.75), a different building ~150m away. The OSM
  # fixture grounds The Packet Building at 155 South Main Street
  # (way/141567737); Brown teaches in its leased "Packet" rooms.
  - id: packet-building
    name: The Packet Building
    kind: academic
    aliases: [The Packet Building, Packet Building, 155 South Main Street, 155 South Main Street - Packet]

