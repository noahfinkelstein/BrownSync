  # 235 Lloyd Avenue, "between Stevenson Field and the Goldberger Family
  # Field"). Coordinates are the centroid of OSM way 141129272
  # (leisure=pitch, "Goldberger Family Field", Stimson Avenue) — a pitch,
  # not a building, so it is absent from the buildings-only Overpass fixture.
  - name: Goldberger Family Field
    kind: athletic
    aliases: [Goldberger Family Field, Goldberger Field]
    lat: 41.830826
    lng: -71.395228
  # Task 8 (athletics ICS evidence): Brown swimming/diving and water polo
  # venue, part of the 2012 Nelson Fitness Center building program on the
